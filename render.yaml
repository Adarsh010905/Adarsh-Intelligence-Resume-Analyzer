databases:
  - name: ai-resume-db
    databaseName: ai_resume_db
    user: ai_resume_user
    plan: free

services:
  - type: web
    name: adarsh-intelligence
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://adarsh-intelligence.onrender.com"
      - key: DB_NAME
        fromDatabase:
          name: ai-resume-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ai-resume-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-resume-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: ai-resume-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-resume-db
          property: port
      - key: GROQ_API_KEY
        sync: false
