# ============================================================
# frontend/nginx.conf — Nginx Web Server Configuration
#
# WHAT IS NGINX?
# Nginx (pronounced "engine-x") is a high-performance web server.
# We use it to serve our React static files in production.
#
# WHY NGINX FOR REACT?
# React apps are just static files (HTML, CSS, JS) after building.
# Nginx is extremely fast at serving static files.
# It can also proxy API requests to Django.
#
# SPA ROUTING: The key config here is "try_files $uri /index.html"
# This tells Nginx: if a file isn't found, always return index.html.
# WHY? React Router handles URLs client-side. When you visit
# /dashboard directly, Nginx can't find a file called "dashboard".
# By returning index.html, React Router takes over and shows the right page.
# ============================================================

server {
    # Listen on port 80 (standard HTTP)
    listen 80;
    server_name localhost;

    # Root directory: where our built React files are
    root /usr/share/nginx/html;
    index index.html;

    # Compression: gzip static files for faster loading
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # React SPA routing: serve index.html for any route not found
    # This is CRITICAL for React Router to work correctly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for 1 year (they have content hashes in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
